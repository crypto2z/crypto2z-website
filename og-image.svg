<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c10"/>
      <stop offset="100%" style="stop-color:#0d1420"/>
    </linearGradient>
    <linearGradient id="green-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- grid lines -->
  <g opacity="0.12">
    <line x1="0" y1="90"  x2="1200" y2="90"  stroke="#00e676" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#00e676" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#00e676" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#00e676" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#00e676" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#00e676" stroke-width="0.5"/>
    <line x1="100"  y1="0" x2="100"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="200"  y1="0" x2="200"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="300"  y1="0" x2="300"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="400"  y1="0" x2="400"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="500"  y1="0" x2="500"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="600"  y1="0" x2="600"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="700"  y1="0" x2="700"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="800"  y1="0" x2="800"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="900"  y1="0" x2="900"  y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#00e676" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#00e676" stroke-width="0.5"/>
  </g>

  <!-- green glow radial behind logo -->
  <ellipse cx="200" cy="315" rx="260" ry="200" fill="url(#glow)" opacity="0.6"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#00e676"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#green-fade)"/>

  <!-- HEX LOGO — large -->
  <g transform="translate(80, 195) scale(3.0)">
    <polygon points="40,0 80,20 80,60 40,80 0,60 0,20" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <polygon points="40,8 72,24 72,56 40,72 8,56 8,24" fill="none" stroke="#1e2d3d" stroke-width="0.75"/>
    <!-- corner dots -->
    <circle cx="40" cy="0"  r="2.2" fill="#00e676"/>
    <circle cx="80" cy="20" r="2.2" fill="#00e676"/>
    <circle cx="80" cy="60" r="2.2" fill="#00e676"/>
    <circle cx="40" cy="80" r="2.2" fill="#00e676"/>
    <circle cx="0"  cy="60" r="2.2" fill="#00e676"/>
    <circle cx="0"  cy="20" r="2.2" fill="#00e676"/>
    <!-- lightning bolt -->
    <path d="M46,18 L34,42 L42,42 L34,62 L50,36 L42,36 Z" fill="#00e676"/>
  </g>

  <!-- WORDMARK -->
  <text x="380" y="290" font-family="'Space Mono', 'Courier New', monospace" font-size="96" font-weight="400" fill="#8899aa" letter-spacing="-2">crypto</text>
  <text x="900" y="290" font-family="'Space Mono', 'Courier New', monospace" font-size="96" font-weight="700" fill="#00e676" letter-spacing="-2">2z</text>

  <!-- .com -->
  <text x="1010" y="290" font-family="'Space Mono', 'Courier New', monospace" font-size="40" font-weight="400" fill="#2a3f52">.com</text>

  <!-- TAGLINE -->
  <text x="382" y="348" font-family="'Space Mono', 'Courier New', monospace" font-size="22" fill="#4a6070" letter-spacing="0.18em">BITCOIN · LIGHTNING · DCA · NODE OPERATOR</text>

  <!-- DIVIDER -->
  <line x1="380" y1="380" x2="1160" y2="380" stroke="#1e2d3d" stroke-width="1"/>

  <!-- BOTTOM STATS ROW -->
  <text x="382" y="430" font-family="'Space Mono', 'Courier New', monospace" font-size="16" fill="#2a3f52" letter-spacing="0.12em">NODE</text>
  <text x="382" y="455" font-family="'Space Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#00e676">steve2z</text>

  <text x="560" y="430" font-family="'Space Mono', 'Courier New', monospace" font-size="16" fill="#2a3f52" letter-spacing="0.12em">HARDWARE</text>
  <text x="560" y="455" font-family="'Space Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#8899aa">Pi 5 · NVMe</text>

  <text x="770" y="430" font-family="'Space Mono', 'Courier New', monospace" font-size="16" fill="#2a3f52" letter-spacing="0.12em">STRATEGY</text>
  <text x="770" y="455" font-family="'Space Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#8899aa">DCA · 8 coins</text>

  <text x="990" y="430" font-family="'Space Mono', 'Courier New', monospace" font-size="16" fill="#2a3f52" letter-spacing="0.12em">ONLINE SINCE</text>
  <text x="990" y="455" font-family="'Space Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#8899aa">2021/2022</text>

  <!-- URL bar bottom -->
  <rect x="0" y="580" width="1200" height="50" fill="#0d1117" opacity="0.8"/>
  <text x="40" y="612" font-family="'Space Mono', 'Courier New', monospace" font-size="18" fill="#4a6070" letter-spacing="0.05em">crypto2z.com</text>
  <text x="1160" y="612" text-anchor="end" font-family="'Space Mono', 'Courier New', monospace" font-size="14" fill="#2a3f52">Bitcoin · Lightning · Markets · Tools</text>
</svg>
